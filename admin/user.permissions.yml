# Admin Plugin — User Permission Definitions
# These permission keys are assigned to roles.
# db.* keys here are linked to table operations via db.permissions.yml.

super_admin:
  db.accounts.full:
    title: 'Full accounts database access'
    description: 'Full select/insert/update/delete on the accounts table.'
  db.accounts.read:
    title: 'Read accounts'
    description: 'Read access to the accounts table.'
  db.system.read:
    title: 'Read system tables'
    description: 'Read access to site_settings and logs.'
  can_manage_plugin_settings:
    title: 'Can manage plugin settings'
    description: 'Configure individual plugin settings from the admin panel.'
  can_clear_caches:
    title: 'Can clear caches'
    description: 'Clear compiled DI, YAML manifest, and Twig caches.'
  can_view_system_logs:
    title: 'Can view system logs'
    description: 'View and download system error and access logs.'

admin:
  db.accounts.full:
    title: 'Full accounts database access'
    description: 'Full select/insert/update/delete on the accounts table.'
  db.accounts.read:
    title: 'Read accounts'
    description: 'Read access to the accounts table.'
  db.system.read:
    title: 'Read system tables'
    description: 'Read access to site_settings and logs.'
  can_manage_plugin_settings:
    title: 'Can manage plugin settings'
    description: 'Configure individual plugin settings from the admin panel.'
  can_clear_caches:
    title: 'Can clear caches'
    description: 'Clear compiled DI, YAML manifest, and Twig caches.'
  can_view_system_logs:
    title: 'Can view system logs'
    description: 'View and download system error and access logs.'

moderator:
  db.accounts.read:
    title: 'Read accounts'
    description: 'Read-only access to the accounts table.'
  can_view_system_logs:
    title: 'Can view system logs'
    description: 'View (not download) system logs.'

editor:
  db.accounts.read:
    title: 'Read accounts'
    description: 'Read-only access to accounts (for author attribution).'
