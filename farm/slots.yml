# =============================================================================
# FARM SLOTS
# =============================================================================
# Every class listed here implements SlotInterface and is ready to be
# connected to any signal (farm or core) via the Signals & Slots admin UI.
# Each ships pre-wired to its natural farm.* signal as a sensible default,
# but rewiring is just an admin-UI action away.
#
# Slots are defensive: missing payload keys are skipped rather than causing
# a fatal error.
# =============================================================================

farm.slot.facility_created:
  name: "Log Facility Creation"
  description: "Logs a new facility being added to the farm."
  class: Simp\Pindrop\Modules\farm\src\Slot\FarmSlotFacilityCreated
  plugin: farm
  payload_required: ["facility"]

farm.slot.facility_updated:
  name: "Log Facility Update"
  description: "Logs a facility being updated."
  class: Simp\Pindrop\Modules\farm\src\Slot\FarmSlotFacilityUpdated
  plugin: farm
  payload_required: ["facility_id"]

