# config/mobile.settings.yml

engine:
  enabled: true
  content_selector: "#app-content"

theme:
  primary_color: "#6200ea"
  status_bar_color: "#6200ea"
  background_color: "#ffffff"
  dark_mode: auto  # auto | light | dark

transitions:
  type: slide       # slide | fade | none
  duration: 300     # ms
  easing: ease-in-out

bottom_navigation:
  enabled: true
  items:
    - label: Home
      icon: home
      route: /mobile/home
    - label: Search
      icon: search
      route: /mobile/search
    - label: Profile
      icon: person
      route: /mobile/profile
    - label: Settings
      icon: settings
      route: /mobile/settings

gestures:
  swipe_back: true
  pull_to_refresh: true
  long_press: false

skeleton:
  enabled: true
  color: "#e0e0e0"
  shimmer: true

# ============================================================
# mobile.settings.yml  — pwa section reference
# Full example showing every field the manifest.json.twig uses.
# Add this into your existing mobile.settings.yml under pwa:
# ============================================================

pwa:
  enabled: true
  app_name: "My Pindrop App"
  short_name: "MyApp"
  description: "A fast, native-feeling mobile app powered by Pindrop."
  start_url: "/"
  scope: "/"

  # display options: standalone | fullscreen | minimal-ui | browser
  display: standalone

  # orientation: portrait-primary | landscape-primary | any
  orientation: portrait-primary

  # Main icon (used as fallback for all sizes)
  icon: /themes/mobile/assets/icons/android/launchericon-512x512.png

  # Optional: explicit icon set for full PWA install support
  icons:
    - src: /themes/mobile/assets/icons/ios/72.png
      sizes: "72x72"
      type: image/png
      purpose: any
    - src: /themes/mobile/assets/icons/android/launchericon-96x96.png
      sizes: "96x96"
      type: image/png
      purpose: any
    - src: /themes/mobile/assets/icons/ios/128.png
      sizes: "128x128"
      type: image/png
      purpose: any
    - src: /themes/mobile/assets/icons/ios/192.png
      sizes: "192x192"
      type: image/png
      purpose: any
    - src: /themes/mobile/assets/icons/ios/512.png
      sizes: "512x512"
      type: image/png
      purpose: any maskable

  # App store categories
  categories:
    - utilities
    - productivity

  # Optional: home screen shortcuts (long-press app icon on Android)
  shortcuts:
    - name: Home
      short_name: Home
      description: Go to homepage
      url: /mobile/home
      icon: /themes/mobile/assets/icons/android/launchericon-96x96.png
    - name: Search
      short_name: Search
      description: Search the app
      url: /mobile/search
      icon: /themes/mobile/assets/icons/android/launchericon-96x96.png

  # Optional: screenshots shown in PWA install prompt
  screenshots:
    - src: /themes/mobile/assets/icons/windows/Square150x150Logo.scale-400.png
      sizes: "390x844"
      type: image/png
      form_factor: narrow
      label: "Home screen"
    - src: /themes/mobile/assets/icons/windows/Square150x150Logo.scale-400.png
      sizes: "390x844"
      type: image/png
      form_factor: narrow
      label: "Search page"