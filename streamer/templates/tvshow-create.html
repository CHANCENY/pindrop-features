<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create TV Show - Video Streaming Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎬 Video Streaming Dashboard</h1>
        </header>

        <nav class="nav">
            <ul>
                <li><a href="index.html">🏠 Dashboard</a></li>
                <li><a href="movies.html">🎬 Movies</a></li>
                <li><a href="tv-shows.html">📺 TV Shows</a></li>
                <li><a href="playlists.html">📋 Playlists</a></li>
            </ul>
        </nav>

        <div class="breadcrumb">
            <a href="index.html">Dashboard</a>
            <span class="separator">›</span>
            <a href="tv-shows.html">TV Shows</a>
            <span class="separator">›</span>
            <a href="tvshow-create.html">Create TV Show</a>
        </div>

        <div class="card">
            <h2>➕ Create New TV Show</h2>
            
            <form id="tvshowCreateForm">
                <div class="grid">
                    <div class="form-group">
                        <label for="title">TV Show Title *</label>
                        <input type="text" id="title" name="title" required placeholder="Enter TV show title">
                    </div>
                    
                    <div class="form-group">
                        <label for="genre">Genre *</label>
                        <select id="genre" name="genre" required>
                            <option value="">Select Genre</option>
                            <option value="drama">Drama</option>
                            <option value="comedy">Comedy</option>
                            <option value="action">Action</option>
                            <option value="sci-fi">Sci-Fi</option>
                            <option value="horror">Horror</option>
                            <option value="thriller">Thriller</option>
                            <option value="romance">Romance</option>
                            <option value="fantasy">Fantasy</option>
                            <option value="documentary">Documentary</option>
                            <option value="reality">Reality TV</option>
                            <option value="animation">Animation</option>
                            <option value="crime">Crime</option>
                            <option value="mystery">Mystery</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="startYear">Start Year *</label>
                        <input type="number" id="startYear" name="startYear" required min="1900" max="2030" placeholder="2024">
                    </div>
                    
                    <div class="form-group">
                        <label for="endYear">End Year</label>
                        <input type="number" id="endYear" name="endYear" min="1900" max="2030" placeholder="Present if ongoing">
                    </div>
                    
                    <div class="form-group">
                        <label for="rating">Rating (0-10)</label>
                        <input type="number" id="rating" name="rating" min="0" max="10" step="0.1" placeholder="8.5">
                    </div>
                    
                    <div class="form-group">
                        <label for="status">Status *</label>
                        <select id="status" name="status" required>
                            <option value="">Select Status</option>
                            <option value="ongoing">🔄 Ongoing</option>
                            <option value="completed">✅ Completed</option>
                            <option value="cancelled">❌ Cancelled</option>
                            <option value="hiatus">⏸️ On Hiatus</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" placeholder="Enter TV show description"></textarea>
                </div>

                <div class="form-group">
                    <label for="creator">Creator(s)</label>
                    <input type="text" id="creator" name="creator" placeholder="Enter creator names">
                </div>

                <div class="form-group">
                    <label for="cast">Main Cast (comma separated)</label>
                    <input type="text" id="cast" name="cast" placeholder="Actor 1, Actor 2, Actor 3">
                </div>

                <div class="form-group">
                    <label for="network">Network/Platform</label>
                    <input type="text" id="network" name="network" placeholder="Netflix, HBO, AMC, etc.">
                </div>

                <div class="form-group">
                    <label for="language">Language</label>
                    <input type="text" id="language" name="language" placeholder="English">
                </div>

                <div class="form-group">
                    <label for="country">Country of Origin</label>
                    <input type="text" id="country" name="country" placeholder="United States">
                </div>

                <div class="grid">
                    <div class="form-group">
                        <label for="poster">Poster Image</label>
                        <input type="file" id="poster" name="poster" accept="image/*">
                    </div>
                    
                    <div class="form-group">
                        <label for="banner">Banner Image</label>
                        <input type="file" id="banner" name="banner" accept="image/*">
                    </div>
                </div>

                <div class="form-group">
                    <label for="tags">Tags (comma separated)</label>
                    <input type="text" id="tags" name="tags" placeholder="drama, thriller, popular, award-winning">
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="featured" name="featured">
                        Featured TV Show
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="adultContent" name="adultContent">
                        Contains Adult Content
                    </label>
                </div>

                <div style="margin-top: 30px; text-align: center;">
                    <button type="submit" class="btn btn-success">💾 Create TV Show</button>
                    <button type="button" class="btn btn-primary" onclick="addSeason()">➕ Add First Season</button>
                    <a href="tv-shows.html" class="btn btn-danger">❌ Cancel</a>
                </div>
            </form>
        </div>

        <div class="card">
            <h3>📊 Quick Season Setup</h3>
            <div id="seasonSetup" style="display: none;">
                <div class="form-group">
                    <label for="firstSeasonTitle">First Season Title</label>
                    <input type="text" id="firstSeasonTitle" placeholder="Season 1">
                </div>
                <div class="form-group">
                    <label for="firstSeasonEpisodes">Number of Episodes</label>
                    <input type="number" id="firstSeasonEpisodes" min="1" placeholder="10">
                </div>
                <div class="form-group">
                    <label for="firstSeasonYear">Release Year</label>
                    <input type="number" id="firstSeasonYear" min="1900" max="2030" placeholder="2024">
                </div>
            </div>
            <p style="text-align: center; color: #666; margin-top: 10px;">You can add seasons after creating the TV show</p>
        </div>

        <div class="card">
            <h3>📈 Upload Progress</h3>
            <div style="background: #f0f0f0; border-radius: 8px; overflow: hidden; height: 20px;">
                <div id="progressBar" style="background: linear-gradient(90deg, #667eea, #764ba2); height: 100%; width: 0%; transition: width 0.3s ease;"></div>
            </div>
            <p id="progressText" style="text-align: center; margin-top: 10px;">Ready to upload</p>
        </div>
    </div>

    <script>
        function addSeason() {
            const seasonSetup = document.getElementById('seasonSetup');
            seasonSetup.style.display = seasonSetup.style.display === 'none' ? 'block' : 'none';
        }

        document.getElementById('tvshowCreateForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            // Simulate upload progress
            let progress = 0;
            progressText.textContent = 'Creating TV show...';
            
            const interval = setInterval(() => {
                progress += 10;
                progressBar.style.width = progress + '%';
                progressText.textContent = `Creating TV show... ${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(interval);
                    progressText.textContent = 'TV show created successfully! Redirecting...';
                    
                    setTimeout(() => {
                        alert('TV show created successfully!');
                        window.location.href = 'tv-shows.html';
                    }, 1000);
                }
            }, 200);
        });

        // Auto-fill end year based on status
        document.getElementById('status').addEventListener('change', function() {
            const endYearField = document.getElementById('endYear');
            if (this.value === 'ongoing') {
                endYearField.value = '';
                endYearField.placeholder = 'Present (ongoing)';
                endYearField.disabled = true;
            } else {
                endYearField.disabled = false;
                endYearField.placeholder = 'Enter end year';
            }
        });
    </script>
</body>
</html>
