  methods: ['POST']
  defaults:
    _controller: 'Simp\Pindrop\Modules\music\src\Controller\InteractionController::toggleLike'
  requirements:
    _permission: ['can_music_like']

music.follow.toggle:
  path: '/music/follow/[id:int]'
  methods: ['POST']
  defaults:
    _controller: 'Simp\Pindrop\Modules\music\src\Controller\InteractionController::toggleFollow'
  requirements:
    _permission: ['can_music_like']

music.report.create:
