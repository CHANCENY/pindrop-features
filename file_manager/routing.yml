# File Manager routes.
# Every route needs can_use_file_manager. NOTE: Pindrop's AuthMiddleware lets any
# admin/super_admin through permission-gated routes, so the controller ALSO
# re-checks the permission (RequestGuard::requireUser). Do not remove that check.

file_manager.index:
  defaults:
    _controller: Simp\Pindrop\Modules\file_manager\src\Controller\FileManagerController::index
  methods:
  - GET
  path: /admin/file-manager
  requirements:
    _permission:
    - can_use_file_manager

file_manager.api.list:
  defaults:
    _controller: Simp\Pindrop\Modules\file_manager\src\Controller\FileManagerController::list
  methods:
  - GET
  path: /admin/file-manager/api/list
  requirements:
    _permission:
    - can_use_file_manager

