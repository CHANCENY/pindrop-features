languages.switcher:
  path: '/internal/lang/switch'
  defaults:
    _controller: 'Simp\Pindrop\Modules\languages\src\Controller\LangController::switchLanguage'
  methods: [POST]
  requirements:
    # Language switching is a utility available to all authenticated users.
    # Uses $_SESSION only — no DB, no permission guard involved.
    _permission: ['can_manage_own_profile', 'can_view_public_content', 'can_create_content', 'can_access_admin_panel']

languages.default:
  path: '/internal/lang/support/default'
  defaults:
    _controller: 'Simp\Pindrop\Modules\languages\src\Controller\LangController::language'
  methods: [GET]
  requirements:
    _permission: ['can_manage_own_profile', 'can_view_public_content', 'can_create_content', 'can_access_admin_panel']
