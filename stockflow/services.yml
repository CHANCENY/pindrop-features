stockflow.service:
  class: Simp\Pindrop\Modules\stockflow\src\Services\StockflowService
  arguments:
    - "@database"
    - "@site.settings"
    - "@filesystem.interface"
stockflow.shipping_methods:
  class: Simp\Pindrop\Modules\stockflow\src\Services\ShippingMethodService
  arguments:
    - "@site.settings"
stockflow.payment_methods:
  class: Simp\Pindrop\Modules\stockflow\src\Payment\PaymentMethodRegistry
  arguments:
    - "@site.settings"
stockflow.adjustments:
  class: Simp\Pindrop\Modules\stockflow\src\Services\AdjustmentConfigurationService
  arguments:
    - "@site.settings"
stockflow.manual_orders:
  class: Simp\Pindrop\Modules\stockflow\src\Services\ManualOrderService
  arguments:
    - "@database"
    - "@site.settings"
    - "@stockflow.shipping_methods"
stockflow.checkout:
  class: Simp\Pindrop\Modules\stockflow\src\Services\ManualOrderService
  arguments:
    - "@database"
    - "@site.settings"
    - "@stockflow.shipping_methods"
stockflow.documents:
  class: Simp\Pindrop\Modules\stockflow\src\Services\StockflowDocumentService
stockflow.api_tokens:
  class: Simp\Pindrop\Modules\stockflow\src\Services\StockflowApiTokenService
  arguments:
    - "@database"
stockflow.checkout_idempotency:
  class: Simp\Pindrop\Modules\stockflow\src\Services\CheckoutIdempotencyService
  arguments:
    - "@database"
