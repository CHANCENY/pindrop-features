<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ledgerly — Log in</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="auth-page">
        <div class="auth-shell"><a class="auth-brand" href="index.html"><span
                    class="mark"><i></i><i></i><i></i></span><span>ledgerly</span></a>
            <section class="auth-card">
                <header class="auth-heading">
                    <p class="eyebrow">Your money, in context</p>
                    <h1>Welcome back</h1>
                    <p>Log in to manage your finance accounts.</p>
                </header>
                <form class="auth-form" action="index.html" method="get">
                    <div class="field"><label for="login-email">Email address</label><input id="login-email"
                            name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
                    <div class="field"><label for="login-password">Password</label>
                        <div class="password-wrap"><input id="login-password" name="password" type="password"
                                autocomplete="current-password" placeholder="Enter your password" required><button
                                type="button">Show</button></div>
                    </div>
                    <div class="auth-options"><label class="check-label"><input type="checkbox" name="remember">
                            Remember me</label><a class="auth-link" href="#forgot-password">Forgot password?</a></div>
                    <button class="button primary auth-submit" type="submit"><b>→</b> Log in</button>
                </form>
                <div class="auth-divider">or</div><a class="auth-secondary" href="#google-login">Continue with
                    Google</a>
                <p class="auth-footer">New to Ledgerly? <a href="register.html">Create an account</a></p>
            </section><a class="auth-back" href="index.html">← Back to Ledgerly preview</a>
        </div>
    </main>
</body>

</html>
